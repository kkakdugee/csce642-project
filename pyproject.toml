[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neuroai-rl"
version = "0.1.0"
description = "Controlled navigation experiments with learned spatial representations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gymnasium>=1.3,<2",
    "numpy>=2,<3",
    "torch>=2,<3",
]

[project.optional-dependencies]
dev = ["ruff>=0.15,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["navigation", "navigation.*"]
namespaces = false

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 10
